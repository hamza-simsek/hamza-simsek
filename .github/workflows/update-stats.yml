name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Her gece yarısı çalışır
  workflow_dispatch: # Manuel çalıştırmak istersen buton ekler

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-node-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python today.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Auto updated stats" || exit 0
          git push
