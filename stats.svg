      white-space: pre; 
    }

    /* KOYU TEMA DÜZENLEMESİ */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .text-main { fill: #c9d1d9; }
      .key { fill: #ffa657; }
      .value { fill: #a5d6ff; }
      .addColor { fill: #3fb950; }
      .delColor { fill: #f85149; }
      .cc { fill: #616e7f; }
      .title { fill: #ff7b72; }
    }
